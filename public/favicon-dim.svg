<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.3" r="0.95">
      <stop offset="0" stop-color="#151a1d"/>
      <stop offset="0.55" stop-color="#0a0a0c"/>
      <stop offset="1" stop-color="#050506"/>
    </radialGradient>
    <linearGradient id="sig" gradientUnits="userSpaceOnUse" x1="15" y1="47" x2="50" y2="17">
      <stop offset="0" stop-color="#5fe6ff"/>
      <stop offset="0.48" stop-color="#e9fbff"/>
      <stop offset="1" stop-color="#ff9a3d"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <radialGradient id="spark">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="0.4" stop-color="#ffb46b"/>
      <stop offset="1" stop-color="#ff9a3d" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g opacity="0.38" style="filter: grayscale(0.6)">

  <rect width="64" height="64" rx="15" fill="url(#bg)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="14.25" fill="none" stroke="#fff" stroke-opacity="0.1" stroke-width="1.5"/>

  <!-- HUD corner brackets -->
  <g fill="none" stroke-width="1.5" stroke-linecap="round">
    <path d="M9 15 V9 H15" stroke="#93f1ff" stroke-opacity="0.55"/>
    <path d="M49 9 H55 V15" stroke="#ffa24c" stroke-opacity="0.45"/>
    <path d="M55 49 V55 H49" stroke="#ffa24c" stroke-opacity="0.3"/>
    <path d="M15 55 H9 V49" stroke="#93f1ff" stroke-opacity="0.4"/>
  </g>

  <!-- P and S drawn as one circuit trace -->
  <g fill="none" stroke="url(#sig)" stroke-linecap="round" stroke-linejoin="round">
    <path id="trace" stroke-width="4.6" stroke-opacity="0.55" filter="url(#soft)"
          d="M16 46 V18 H27.5 L31.5 22 V27.5 L27.5 31.5 H16 M50 18 H40.5 L37 21.5 V28 L40.5 31.5 H46.5 L50 35 V42.5 L46.5 46 H37"/>
    <path stroke-width="3.8"
          d="M16 46 V18 H27.5 L31.5 22 V27.5 L27.5 31.5 H16 M50 18 H40.5 L37 21.5 V28 L40.5 31.5 H46.5 L50 35 V42.5 L46.5 46 H37"/>
  </g>

  <!-- Circuit nodes -->
  <circle cx="16" cy="46" r="3.1" fill="#050506" stroke="#5fe6ff" stroke-width="1.8"/>
  <circle cx="50" cy="18" r="6" fill="url(#spark)"/>
  <circle cx="50" cy="18" r="2.2" fill="#fff"/>
  </g>
</svg>
