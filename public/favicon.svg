<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>

  <!-- Left angle bracket -->
  <polyline points="6,10 2.5,16 6,22" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.45"/>

  <!-- Right angle bracket -->
  <polyline points="26,10 29.5,16 26,22" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.45"/>

  <!-- PS — bold white, centred -->
  <text
    x="16" y="21.5"
    text-anchor="middle"
    font-family="'Courier New', Courier, monospace"
    font-weight="700"
    font-size="11"
    fill="#ffffff"
    letter-spacing="1"
  >PS</text>
</svg>
