<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="bg" cx="0.6" cy="0.4" r="0.85">
      <stop offset="0" stop-color="#1d1813"/>
      <stop offset="0.55" stop-color="#0b0b0d"/>
      <stop offset="1" stop-color="#050506"/>
    </radialGradient>
    <linearGradient id="signal" gradientUnits="userSpaceOnUse" x1="18" y1="52" x2="46" y2="14">
      <stop offset="0" stop-color="#93f1ff"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffa24c"/>
    </linearGradient>
    <radialGradient id="core">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.3" stop-color="#ffd2a3"/>
      <stop offset="0.6" stop-color="#ffa24c" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffa24c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spark">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#93f1ff"/>
      <stop offset="1" stop-color="#93f1ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="64" height="64" rx="15" fill="url(#bg)"/>
  <rect x="1" y="1" width="62" height="62" rx="14" fill="none" stroke="#fff" stroke-opacity="0.12" stroke-width="1.5"/>

  <!-- Faint outer orbit -->
  <circle cx="33" cy="27" r="19.5" fill="none" stroke="#93f1ff" stroke-opacity="0.18" stroke-width="1.1"/>

  <!-- "P": stem + portal ring as the bowl -->
  <g filter="url(#glow)" fill="none" stroke="url(#signal)" stroke-linecap="round" stroke-width="5">
    <path d="M21 27 V51"/>
    <circle cx="33" cy="27" r="12"/>
  </g>

  <!-- Signal core -->
  <circle cx="33" cy="27" r="7.5" fill="url(#core)"/>

  <!-- Orbiting spark on the outer orbit -->
  <circle cx="49.9" cy="17.25" r="5" fill="url(#spark)"/>
</svg>
