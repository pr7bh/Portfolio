<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1e1e"/>
      <stop offset="100%" stop-color="#070707"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="white" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" rx="8" fill="url(#bg)"/>

  <!-- Top glass shine -->
  <rect width="32" height="15" rx="8" fill="url(#shine)"/>
  <rect y="7" width="32" height="8" fill="url(#shine)"/>

  <!-- Border ring -->
  <rect x="0.75" y="0.75" width="30.5" height="30.5" rx="7.25"
        fill="none" stroke="white" stroke-opacity="0.14" stroke-width="1"/>

  <!-- PS centred — P bright, S dimmer for depth -->
  <text x="16" y="21" text-anchor="middle"
    font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif"
    font-weight="800" font-size="15">
    <tspan fill="white">P</tspan><tspan fill="white" opacity="0.55">S</tspan>
  </text>
</svg>
